<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">One filter combines all input channels</title>
  <desc id="desc">Each channel is convolved with its corresponding kernel. The resulting maps are summed element by element to form one output channel. Bias is omitted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="560" height="420" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="24" y="38" font-size="23" font-weight="700">Inside one filter</text>
    <text x="24" y="68" font-size="19" fill="#475569">Same color = corresponding channel + kernel</text>
    <g stroke-width="1.5">
      <g fill="#dbeafe" stroke="#2563eb"><rect x="24" y="91" width="138" height="48" rx="8"/><rect x="225" y="91" width="66" height="48" rx="8"/><rect x="354" y="91" width="114" height="48" rx="8"/></g>
      <g fill="#fef3c7" stroke="#b45309"><rect x="24" y="157" width="138" height="48" rx="8"/><rect x="225" y="157" width="66" height="48" rx="8"/><rect x="354" y="157" width="114" height="48" rx="8"/></g>
      <g fill="#ede9fe" stroke="#7c3aed"><rect x="24" y="223" width="138" height="48" rx="8"/><rect x="225" y="223" width="66" height="48" rx="8"/><rect x="354" y="223" width="114" height="48" rx="8"/></g>
    </g>
    <g text-anchor="middle" font-size="21">
      <text x="93" y="123">Channel 0</text><text x="258" y="123">K0</text><text x="411" y="123">Map 0</text>
      <text x="93" y="189">Channel 1</text><text x="258" y="189">K1</text><text x="411" y="189">Map 1</text>
      <text x="93" y="255">Channel 2</text><text x="258" y="255">K2</text><text x="411" y="255">Map 2</text>
    </g>
    <g text-anchor="middle" font-size="18" fill="#475569">
      <text x="193" y="122">conv</text><text x="193" y="188">conv</text><text x="193" y="254">conv</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M302 115H343"/><path d="M302 181H343"/><path d="M302 247H343"/>
      <path d="M468 115H512V314H381"/>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2"><path d="M468 181H512"/><path d="M468 247H512"/></g>
    <rect x="180" y="289" width="200" height="50" rx="25" fill="#e2e8f0"/>
    <text x="280" y="321" text-anchor="middle" font-size="21" font-weight="700">Sum the maps</text>
    <path d="M280 339V358" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="147" y="365" width="266" height="39" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="280" y="391" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">One output channel</text>
  </g>
</svg>
