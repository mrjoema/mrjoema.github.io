<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">Weights contain filters; filters contain kernels</title>
  <desc id="desc">Example: N equals 3 input channels and M equals 2 filters. Each filter contains kernels 0, 1, and 2.</desc>
  <rect width="560" height="300" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="24" y="38" font-size="23" font-weight="700">Layer weights</text>
    <text x="24" y="69" font-size="19" fill="#475569">Example: N = 3 channels · M = 2 filters</text>
    <rect x="24" y="91" width="246" height="147" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="290" y="91" width="246" height="147" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="147" y="124" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Filter 0</text>
    <text x="413" y="124" text-anchor="middle" font-size="22" font-weight="700" fill="#6d28d9">Filter 1</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5">
      <rect x="42" y="145" width="62" height="62" rx="6"/>
      <rect x="116" y="145" width="62" height="62" rx="6"/>
      <rect x="190" y="145" width="62" height="62" rx="6"/>
    </g>
    <g fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5">
      <rect x="308" y="145" width="62" height="62" rx="6"/>
      <rect x="382" y="145" width="62" height="62" rx="6"/>
      <rect x="456" y="145" width="62" height="62" rx="6"/>
    </g>
    <g text-anchor="middle" font-size="22" font-weight="700">
      <text x="73" y="184">K0</text><text x="147" y="184">K1</text><text x="221" y="184">K2</text>
      <text x="339" y="184">K0</text><text x="413" y="184">K1</text><text x="487" y="184">K2</text>
    </g>
    <text x="280" y="274" text-anchor="middle" font-size="19" fill="#475569">Each K is a 2D kernel for one input channel.</text>
  </g>
</svg>
